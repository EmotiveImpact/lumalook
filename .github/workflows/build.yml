# Build: a compile check on every push, and a route to TestFlight that needs
# no Mac.
#
# Xcode Cloud reports only to App Store Connect, so a broken build is
# invisible from GitHub. This job archives the app the way Xcode Cloud does
# (Release, for a real iPhone, with Xcode 26 or later, which App Store Connect
# has required for uploads since 28 April 2026) and resolves packages strictly
# from Package.resolved, as Xcode Cloud does. If it fails, the compiler errors
# are listed at the very end of the log and annotated on the run.
#
# TestFlight upload (optional). Add these three repository secrets and every
# push to master, or a manual run from the Actions tab, also signs the archive
# with Apple's cloud-managed distribution certificate and uploads it:
#   ASC_KEY_ID      the key ID of an App Store Connect API team key with Admin
#                   access (cloud signing needs Admin)
#   ASC_ISSUER_ID   the Issuer ID shown above the list of keys
#   ASC_KEY_P8      the whole text of the downloaded AuthKey_<key ID>.p8 file
# Without them the job stops after the compile check. The upload never runs
# for pull requests, and GitHub never hands secrets to pull requests from forks.
name: Build

on:
  push:
    branches: [master]
    paths-ignore: ['website/**']
  pull_request:
    paths-ignore: ['website/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    name: Archive (Release, iPhone)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TEAM_ID: FC88M2P4F9
      ARCHIVE: ${{ github.workspace }}/build/LumaLook.xcarchive
    steps:
      - uses: actions/checkout@v5

      - name: Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
          # Report every compiler error in one run, not just the first batch.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES

      - name: Archive (unsigned)
        run: |
          # Build numbers from Xcode Cloud are small and sequential; starting
          # these at 1000 keeps the two routes from ever colliding.
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          LOG="$RUNNER_TEMP/archive.log"
          if xcodebuild archive \
              -project LumaLook.xcodeproj \
              -scheme LumaLook \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE" \
              -disableAutomaticPackageResolution \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY= \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              INFOPLIST_KEY_CFBundleVersion="$BUILD_NUMBER" \
              > "$LOG" 2>&1; then
            echo "Archive succeeded as build $BUILD_NUMBER."
            echo "Warnings in the app's own code:"
            grep -E ': warning: ' "$LOG" | grep "$GITHUB_WORKSPACE/LumaLook/" \
              | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -80 || true
          else
            echo "::group::Last 150 lines of the xcodebuild log"
            tail -150 "$LOG" || true
            echo "::endgroup::"
            grep -E '^/[^:]+:[0-9]+:[0-9]+: error: ' "$LOG" | sort -u | head -40 \
              | while IFS= read -r line; do
                  path=${line%%:*}; rest=${line#*:}
                  row=${rest%%:*}; rest=${rest#*:}
                  col=${rest%%:*}; msg=${rest#*: error: }
                  msg=$(printf '%s' "$msg" | sed 's/%/%25/g')
                  echo "::error file=${path#"$GITHUB_WORKSPACE"/},line=$row,col=$col::$msg"
                done || true
            echo "Errors (deduplicated):"
            grep -E 'error: ' "$LOG" | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -150 || true
            exit 1
          fi

      - name: Decide whether to upload
        id: gate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Compile check only. Add the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 secrets to upload to TestFlight."
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] \
            || { [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/master ]; }; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "Not uploading: TestFlight uploads run for pushes to master and manual runs only."
          fi

      - name: Sign with cloud signing and upload to TestFlight
        if: steps.gate.outputs.upload == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          trap 'rm -f "$KEY"' EXIT
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          LOG="$RUNNER_TEMP/export.log"
          if xcodebuild -exportArchive \
              -archivePath "$ARCHIVE" \
              -exportPath "$RUNNER_TEMP/export" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$KEY" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              > "$LOG" 2>&1; then
            tail -25 "$LOG"
            echo "::notice::Build $BUILD_NUMBER uploaded. App Store Connect takes a few minutes to process it before it appears in TestFlight."
          else
            tail -150 "$LOG"
            exit 1
          fi

      - name: Wait for TestFlight processing
        if: steps.gate.outputs.upload == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: com.emotiveimpact.lumalook
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]==2.10.1"
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/testflight_status.py
