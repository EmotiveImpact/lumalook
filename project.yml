name: LumaLook
options:
  bundleIdPrefix: com.emotiveimpact
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Pow:
    url: https://github.com/EmergeTools/Pow
    from: 1.0.0
# Shared scheme — required by Xcode Cloud.
schemes:
  LumaLook:
    build:
      targets:
        LumaLook: all
    run:
      config: Debug
      # Local StoreKit testing: products/trials resolve without App Store
      # Connect when running from Xcode (C5; pricing locked 2026-07).
      storeKitConfiguration: LumaLook/LumaLook.storekit
    archive:
      config: Release
targets:
  LumaLook:
    type: application
    platform: iOS
    info:
      path: LumaLook/Info.plist
      properties:
        # Open-in-place .cube + ZIP packs (#117): LumaLook registers as a
        # destination for LUTs from Files/Mail/Safari.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Cube LUT
            LSHandlerRank: Owner
            LSItemContentTypes: [com.emotiveimpact.lumalook.cube]
          - CFBundleTypeName: ZIP Archive
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.emotiveimpact.lumalook.cube
            UTTypeDescription: Cube LUT
            UTTypeConformsTo: [public.plain-text, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cube, CUBE]
    sources:
      - LumaLook
    dependencies:
      - package: Pow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emotiveimpact.lumalook
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: "Automatic"
        DEVELOPMENT_TEAM: "FC88M2P4F9"
        GENERATE_INFOPLIST_FILE: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_CFBundleVersion: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSCameraUsageDescription: "LumaLook needs camera access so you can record cinematic video with live looks."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "LumaLook needs microphone access to record audio with your videos."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "LumaLook needs photo library access so you can choose videos to edit."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "LumaLook needs permission to save exported videos to your photo library."
        INFOPLIST_KEY_CFBundleDisplayName: "LumaLook"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
